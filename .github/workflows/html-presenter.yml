name: HTML presenter offline validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.23
      - name: Existing offline checks
        run: uv run --no-project --python 3.12 python tests.py
      - name: Install locked presenter and browser
        working-directory: experiments/html-presenter
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium
      - name: Synthetic protocol and browser checks only
        working-directory: experiments/html-presenter
        run: |
          uv run python test_activities.py
          uv run python validate.py
